<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ascerex contact form definition</title>
  </head>
  <body>
    <form
      name="ascerex-contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="ascerex-contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="organization" />
      <select name="inquiry-type">
        <option value="general">General inquiry</option>
      </select>
      <input name="subject" />
      <textarea name="message"></textarea>
    </form>

    <form name="ascerex-investors" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>

      <input name="organization" />
      <select name="inquiry-type"><option value="investor">Investor inquiry</option></select>
      <input name="subject" />
      <textarea name="message"></textarea>
    </form>
